name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR supersedes its running checks. Each push to main runs on its own (its group is
# its run id), so a run waiting for production approval never holds up the next one (TEMPRA-18).
# Deploys are ordered by the job-level groups below, and a deploy job whose commit is no longer the
# tip of main skips itself, so an older run can never overwrite a newer deploy.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check

  # The Phase 1 gate (import and export Google's sample bundles) and the MCP smoke flow,
  # both over HTTP against `cf dev` with local D1, R2 and Durable Object state.
  gate:
    name: Gate (cf dev)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run gate
        env:
          CF_SEND_TELEMETRY: "false"

  # worker/ is the deployable project: it must install and build with nothing from the rest of
  # this repository but the two packages it imports. `cf deploy --dry-run` builds and validates
  # without credentials.
  standalone:
    name: worker/ builds on its own (with design/ and app/)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # worker/ plus the packages it imports from the repo (design/, and app/, whose bundle
      # `bun install` builds), under a bare workspace root.
      - name: Copy worker/, design/ and app/ alone, install, build
        run: |
          dest="$RUNNER_TEMP/standalone"
          mkdir -p "$dest"
          git ls-files worker design app | tar -cf - -T - | tar -xf - -C "$dest"
          echo '{"private":true,"workspaces":["worker","design","app"]}' > "$dest/package.json"
          cd "$dest"
          bun install
          cd worker
          bunx cf deploy --dry-run
          bun run typecheck
        env:
          CF_SEND_TELEMETRY: "false"

  # The landing page (site/, tempra.dev): Astro check, the Worker's tests, a static build. Its
  # previews and deploys run on Cloudflare Workers Builds, not here (tempra-dev: delivery/site).
  site:
    name: site/ builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run build

  # CI/CD (tempra-dev library: delivery/ci-cd). Each stage is off until the operator turns it on
  # with a repository variable, once its prerequisites exist: PREVIEWS, STAGING_DEPLOYS and
  # PRODUCTION_DEPLOYS = on. Production also waits for approval in the `production` environment.

  # PR #N's own Worker on pr-N.tempra.dev (delivery/preview-deployments). Not for forks: their
  # runs get no secrets.
  preview:
    name: Preview deployment
    needs: [check, gate, standalone]
    if: >-
      github.event_name == 'pull_request' && vars.PREVIEWS == 'on' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    # Shared with the teardown in preview-cleanup.yml: a newer push, or closing the PR, wins.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: preview
      url: ${{ steps.up.outputs.url }}
    env:
      CF_SEND_TELEMETRY: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TEMPRA_PREVIEW_EMAIL: ${{ secrets.PREVIEW_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - id: up
        working-directory: worker
        run: bun run preview up --pr ${{ github.event.pull_request.number }}
      - name: Comment the URL on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.up.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker="<!-- tempra-preview -->"
          body="Preview: $URL (at ${SHA:0:7}). Torn down when this PR closes.
          $marker"
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi

  # Every merge to main: migrations, deploy, then a check against the live staging Worker.
  staging:
    name: Deploy staging
    needs: [check, gate, standalone]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_DEPLOYS == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    outputs:
      deployed: ${{ steps.tip.outputs.deploy }}
    environment:
      name: staging
      url: https://staging.tempra.dev
    env:
      CF_SEND_TELEMETRY: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SMOKE_TOKEN: ${{ secrets.STAGING_MCP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Still the tip of main?
        id: tip
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"
          else echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "::notice::Superseded by $tip; not deploying $GITHUB_SHA."; fi
      - if: steps.tip.outputs.deploy == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - if: steps.tip.outputs.deploy == 'true'
        run: bun install --frozen-lockfile
      - if: steps.tip.outputs.deploy == 'true'
        working-directory: worker
        run: bun run deploy --mode staging --message "${{ github.sha }}"
      - if: steps.tip.outputs.deploy == 'true'
        name: Check staging
        working-directory: worker
        run: |
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors https://staging.tempra.dev/healthz
          if [ -n "$SMOKE_TOKEN" ]; then
            bun scripts/mcp-smoke.ts --url https://staging.tempra.dev --token "$SMOKE_TOKEN"
          fi

  # After staging, a person approves in the `production` environment (required reviewer). Approving
  # an older run that waited while main moved on is harmless: its tip check skips the deploy.
  production:
    name: Deploy production
    needs: [staging]
    # A run whose commit was superseded before staging never asks for approval.
    if: vars.PRODUCTION_DEPLOYS == 'on' && needs.staging.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://app.tempra.dev
    env:
      CF_SEND_TELEMETRY: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SMOKE_TOKEN: ${{ secrets.PRODUCTION_MCP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Still the tip of main?
        id: tip
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"
          else echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "::notice::Superseded by $tip; not deploying $GITHUB_SHA."; fi
      - if: steps.tip.outputs.deploy == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - if: steps.tip.outputs.deploy == 'true'
        run: bun install --frozen-lockfile
      - if: steps.tip.outputs.deploy == 'true'
        working-directory: worker
        run: bun run deploy --mode production --message "${{ github.sha }}"
      - if: steps.tip.outputs.deploy == 'true'
        name: Check production
        working-directory: worker
        run: |
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors https://app.tempra.dev/healthz
          if [ -n "$SMOKE_TOKEN" ]; then
            bun scripts/mcp-smoke.ts --url https://app.tempra.dev --token "$SMOKE_TOKEN" --read-only
          fi
