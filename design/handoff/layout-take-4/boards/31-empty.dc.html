</div>
</header>

<nav aria-label="Library" style="border-right: 1px solid #ececec; display: flex; flex-direction: column; padding: 18px 12px 14px; gap: 2px; font-size: 14px">

<a href="#" style="display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: #3a3a3a"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b6b6b" stroke-width="1.6"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Activity</a>
<div style="height: 1px; background: #ececec; margin: 12px 10px"></div>
<div style="padding: 6px 10px; font-size: 13px; color: #9b9b9b">No pages yet</div>
</nav>

<main style="overflow: hidden; display: flex; justify-content: center">
<div style="width: 100%; max-width: 760px; padding: 56px 48px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px">

<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 18px">
<li style="display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 14px"><span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 999px; border: 1px solid #e2e2e2; display: grid; place-items: center; font-size: 12px; color: #6b6b6b">1</span><div style="display: flex; flex-direction: column; gap: 10px"><span>Add Tempra to your agent:</span><div style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 16px; border: 1px solid #ececec; border-radius: 10px; background: #f8f8f8; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13.5px">https://app.tempra.dev/mcp<button type="button" aria-label="Copy URL" style="margin-left: auto; width: 30px; height: 30px; border: 1px solid #e2e2e2; border-radius: 999px; background: #ffffff; display: grid; place-items: center; cursor: pointer"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button></div></div></li>
<li style="display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 14px"><span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 999px; border: 1px solid #e2e2e2; display: grid; place-items: center; font-size: 12px; color: #6b6b6b">2</span><div style="display: flex; flex-direction: column; gap: 10px"><span>Ask it to start, for example: "In my notes library, keep a page for each book I mention."</span></div></li>
</ol>
<div role="status" style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px dashed #e2e2e2; border-radius: 10px; color: #6b6b6b"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #e2550f; flex: none; animation: tempra-pulse 1.6s ease-in-out infinite"></span>Waiting for the first write…</div>
</section><div style="font-size: 13px; color: #8a8a8a"><a href="#" style="color: #1b1b1b; text-decoration: underline; text-decoration-color: #cfcfcf; text-underline-offset: 3px; color: #3a3a3a">Import a bundle</a></div>
</div>
</main>

</div>
